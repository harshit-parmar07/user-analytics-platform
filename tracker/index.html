<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analytics Tracker Demo</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 20px;
      box-sizing: border-box;
      position: relative;
    }
    h1 {
      margin-top: 0;
      margin-bottom: 10px;
    }
    p {
      margin-bottom: 20px;
      color: #333;
    }
    .btn {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }
    .btn-top-left {
      position: absolute;
      top: 150px;
      left: 20px;
    }
    .btn-top-right {
      position: absolute;
      top: 150px;
      right: 20px;
    }
    .btn-center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
    .btn-bottom-left {
      position: absolute;
      bottom: 20px;
      left: 20px;
    }
    .btn-bottom-right {
      position: absolute;
      bottom: 20px;
      right: 20px;
    }
  </style>
</head>
<body>
  <h1>User Analytics Demo</h1>
  <p>This is a simplified demo page for tracking user actions. Use the buttons below to generate heatmap event logs.</p>
  <button class="btn btn-top-left" id="btn-top-left">Top Left Button</button>
  <button class="btn btn-top-right" id="btn-top-right">Top Right Button</button>
  <button class="btn btn-center" id="btn-center">Center Button</button>
  <button class="btn btn-bottom-left" id="btn-bottom-left">Bottom Left Button</button>
  <button class="btn btn-bottom-right" id="btn-bottom-right">Bottom Right Button</button>
  <script src="./tracker.js" data-api-url="https://user-analytics-platform-uc39.onrender.com/api/events"></script>
</body>
</html>
